name: Blast Radius PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        
      - name: 🔍 Step 1 - Generate Dependency Graph
        uses: mchittineni/blast-radius-indexer@v1
        with:
          org-name: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛡️ Step 2 - Check PR Impact
        uses: mchittineni/blast-radius-check@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}